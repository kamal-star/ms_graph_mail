[project]
name = "ms_graph_mail"
authors = [
    { name = "MachineSens IoT", email = "info@machinesensiot.com" }
]
description = "Send Frappe / ERPNext email through the Microsoft Graph API instead of SMTP"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
